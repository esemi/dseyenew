name: deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  on-success:
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.SSH_PASSWORD }}
      REMOTE: ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}
      TARGET_DIR: /home/${{ secrets.SSH_USERNAME }}
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: first ssh
        run: |
          sshpass -e ssh $SSH_OPTS "$REMOTE" '
            mkdir -p Zend &&
            mkdir -p app/logs && chgrp www-data app/logs &&
            mkdir -p app/sessions && chgrp www-data app/sessions &&
            mkdir -p app/cache && chgrp www-data app/cache &&
            mkdir -p app/www app/app app/conf'

      # -O: legacy scp protocol (as the old paramiko-based action did), no sftp-server required
      - name: scp
        run: |
          sshpass -e scp -O -r $SSH_OPTS ./www/* "$REMOTE:$TARGET_DIR/app/www/"
          sshpass -e scp -O -r $SSH_OPTS ./app/* "$REMOTE:$TARGET_DIR/app/app/"
          sshpass -e scp -O -r $SSH_OPTS ./conf/* "$REMOTE:$TARGET_DIR/app/conf/"

      - name: last ssh
        run: |
          sshpass -e ssh $SSH_OPTS "$REMOTE" '
            (test -d Zend/Zend || tar -xzf app/conf/Zend.tar.gz -C Zend) &&
            crontab app/conf/crontab'
